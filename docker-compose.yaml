# FutuOpenD Docker Swarm production deployment
# NOTE: This file requires Docker Swarm mode (docker stack deploy).
# For standalone Docker Compose, use docker-compose.simple.yaml instead.
#
# Required env vars:
#   RSA_FILE_LOCAL_PATH      — path to RSA private key file
#   FUTU_OPEND_XML_LOCAL_PATH — path to FutuOpenD.xml config file
services:
  futuopend:
    image: shing1211/futuopend:latest
    container_name: futuopend
    restart: unless-stopped
    platform: linux/${PLATFORM:-amd64}
    environment:
      - TZ=${TZ:-Asia/Hong_Kong}
    volumes:
      - futuopend-data:/home/futuopend/.com.futunn.FutuOpenD
    secrets:
      - source: rsa-key
        target: /run/secrets/rsa_key.txt
        mode: 0400
      - source: config
        target: /run/secrets/FutuOpenD.xml
        mode: 0400
    ports:
      - "11111:11111"
      - "11112:11112"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "pgrep", "-x", "FutuOpenD"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s

volumes:
  futuopend-data:

secrets:
  rsa-key:
    file: ${RSA_FILE_LOCAL_PATH:?RSA_FILE_LOCAL_PATH is not set}
  config:
    file: ${FUTU_OPEND_XML_LOCAL_PATH:?FUTU_OPEND_XML_LOCAL_PATH is not set}
