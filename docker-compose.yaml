services:
  futuopend:
    image: shing1211/futuopend:latest
    container_name: futuopend
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Hong_Kong}
    volumes:
      - futuopend-data:/home/futuopend/.com.futunn.FutuOpenD
    secrets:
      - source: rsa-key
        target: /run/secrets/rsa_key.txt
        mode: 0400
      - source: config
        target: /run/secrets/FutuOpenD.xml
        mode: 0400
    ports:
      - "11111:11111"
      - "11112:11112"
    env_file:
      - path: .env
        required: false
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "pgrep", "-x", "FutuOpenD"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  futuopend-data:

secrets:
  rsa-key:
    file: ${RSA_FILE_LOCAL_PATH:?RSA_FILE_LOCAL_PATH is not set}
  config:
    file: ${FUTU_OPEND_XML_LOCAL_PATH:?FUTU_OPEND_XML_LOCAL_PATH is not set}
