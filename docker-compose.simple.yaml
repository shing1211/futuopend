services:
  futuopend:
    build:
      context: .
      dockerfile: Dockerfile
      target: final-ubuntu
    image: shing1211/futuopend:latest
    container_name: futuopend
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Hong_Kong}
    volumes:
      - ./FutuOpenD.xml:/run/secrets/FutuOpenD.xml:ro
      - futuopend-data:/home/futuopend/.com.futunn.FutuOpenD
    ports:
      - "11111:11111"
      - "11112:11112"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

volumes:
  futuopend-data:
