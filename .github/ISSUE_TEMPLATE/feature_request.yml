name: Feature request
description: Suggest an improvement to the build, image, or docs
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas or questions, consider [Discussions](https://github.com/shing1211/futuopend/discussions) instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
